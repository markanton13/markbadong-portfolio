<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized CCC&amp;C digital operations overview</title>
  <desc id="desc">A conceptual, public-safe diagram connecting a responsive website to GoHighLevel CRM and program workflow areas, with manual QA and human review. It contains no client records, dashboard captures, or private data.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1730"/><stop offset="1" stop-color="#16283d"/></linearGradient>
    <linearGradient id="web" x2="1" y2="1"><stop stop-color="#26386c"/><stop offset="1" stop-color="#282653"/></linearGradient>
    <linearGradient id="crm" x2="1" y2="1"><stop stop-color="#17455a"/><stop offset="1" stop-color="#163644"/></linearGradient>
    <linearGradient id="ops" x2="1" y2="1"><stop stop-color="#392e64"/><stop offset="1" stop-color="#242748"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#70e9d3"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif}.micro{font-size:12px;font-weight:800;letter-spacing:2px}.label{font-size:16px;font-weight:800}.body{font-size:13px;font-weight:500}.small{font-size:11px;font-weight:700}
    </style>
  </defs>
  <rect width="1200" height="690" rx="24" fill="url(#bg)"/>
  <g opacity=".22" stroke="#7184ad" stroke-width="1"><path d="M0 98h1200M0 618h1200M62 0v690M1138 0v690"/></g>
  <text x="58" y="62" fill="#87efdd" class="micro">CLIENT STUDIO / SANITIZED OVERVIEW</text>
  <text x="58" y="103" fill="#f3f5ff" font-size="26" font-weight="800">Website, CRM and program operations</text>
  <text x="1140" y="62" fill="#aab7d1" text-anchor="end" class="small">CONCEPTUAL · NO CLIENT DATA</text>

  <g>
    <rect x="56" y="155" width="278" height="174" rx="14" fill="url(#web)" stroke="#8473df" stroke-width="2"/>
    <rect x="77" y="179" width="47" height="37" rx="5" fill="#171f40" stroke="#a89aff"/>
    <path d="M85 202h30M85 194h23M85 186h17" stroke="#88efde" stroke-width="3" stroke-linecap="round"/>
    <text x="142" y="195" fill="#c4baff" class="micro">01 / WEBSITE</text>
    <text x="78" y="253" fill="#fff" class="label">GoHighLevel site</text>
    <text x="78" y="280" fill="#d1d8ee" class="body">Six responsive pages · HTML / CSS</text>
    <text x="78" y="302" fill="#d1d8ee" class="body">Navigation · lead capture · booking · CTAs</text>
  </g>
  <path d="M346 242h78" fill="none" stroke="#70e9d3" stroke-width="3" marker-end="url(#arrow)" filter="url(#glow)"/>

  <g>
    <rect x="442" y="155" width="304" height="174" rx="14" fill="url(#crm)" stroke="#56d7c1" stroke-width="2"/>
    <circle cx="478" cy="197" r="22" fill="#0f2b38" stroke="#70e9d3" stroke-width="2"/>
    <circle cx="478" cy="190" r="6" fill="#9ff5e5"/><path d="M466 207q12-15 24 0" fill="none" stroke="#9ff5e5" stroke-width="3" stroke-linecap="round"/>
    <text x="516" y="195" fill="#8df1dc" class="micro">02 / CRM FOUNDATION</text>
    <text x="466" y="253" fill="#fff" class="label">GoHighLevel CRM</text>
    <text x="466" y="280" fill="#d0e5eb" class="body">Contacts · fields · tags · forms</text>
    <text x="466" y="302" fill="#d0e5eb" class="body">Pipelines · opportunities · calendars</text>
  </g>
  <path d="M758 242h78" fill="none" stroke="#70e9d3" stroke-width="3" marker-end="url(#arrow)" filter="url(#glow)"/>

  <g>
    <rect x="854" y="155" width="290" height="174" rx="14" fill="url(#ops)" stroke="#a18cf4" stroke-width="2"/>
    <rect x="879" y="177" width="39" height="39" rx="8" fill="#27224b" stroke="#b4a6ff"/>
    <path d="M888 189h21M888 197h16M888 205h11" stroke="#ffce83" stroke-width="3" stroke-linecap="round"/>
    <text x="935" y="195" fill="#c3b7ff" class="micro">03 / PROGRAM FLOWS</text>
    <text x="878" y="253" fill="#fff" class="label">Connected workflows</text>
    <text x="878" y="280" fill="#ddd9f2" class="body">Assessment · membership · onboarding</text>
    <text x="878" y="302" fill="#ddd9f2" class="body">Cohort · follow-up · event-facing UI</text>
  </g>

  <path d="M589 341v62M999 341v62M232 341v62M232 403h767" fill="none" stroke="#657898" stroke-width="2" stroke-dasharray="6 7"/>
  <path d="M589 403h0M999 403h0" fill="none" stroke="#657898" stroke-width="2" marker-end="url(#arrow)"/>
  <g>
    <rect x="56" y="432" width="342" height="130" rx="12" fill="#191e33" stroke="#f0b55b" stroke-width="1.5"/>
    <text x="80" y="468" fill="#ffd181" class="micro">4 / MANUAL QA &amp; TROUBLESHOOTING</text>
    <text x="80" y="500" fill="#f4f1e9" class="label">Check the behavior before release</text>
    <text x="80" y="527" fill="#c4cbd9" class="body">Selected actions tested; workflow status varies.</text>
  </g>
  <g>
    <rect x="430" y="432" width="342" height="130" rx="12" fill="#191e33" stroke="#6bcae8" stroke-width="1.5"/>
    <text x="454" y="468" fill="#81dff5" class="micro">5 / DOCUMENTATION &amp; HANDOFF</text>
    <text x="454" y="500" fill="#f4f1e9" class="label">Keep systems understandable</text>
    <text x="454" y="527" fill="#c4cbd9" class="body">Technical and operational guidance prepared.</text>
  </g>
  <g>
    <rect x="804" y="432" width="340" height="130" rx="12" fill="#191e33" stroke="#a18cf4" stroke-width="1.5"/>
    <text x="828" y="468" fill="#c4b7ff" class="micro">STATUS KEY</text>
    <text x="828" y="500" fill="#f4f1e9" class="body">Implemented · Configured · Manually tested</text>
    <text x="828" y="525" fill="#c4cbd9" class="body">Draft or dependent · Unverified lifecycle</text>
  </g>
  <text x="600" y="631" fill="#8f9db7" text-anchor="middle" class="small">Sanitized summary based on documented contribution categories; this is not a production system map or screenshot.</text>
</svg>
