<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="t d"><title id="t">Learning Library architecture</title><desc id="d">Learner requests flow through Cloudflare Pages and Workers to D1 and connected providers.</desc><rect width="1200" height="720" rx="34" fill="#07111f"/><g font-family="Arial,sans-serif"><text x="64" y="72" font-size="30" font-weight="700" fill="#fff">Serverless access architecture</text><g transform="translate(64 142)"><rect width="200" height="110" rx="18" fill="#1d4ed8"/><text x="100" y="48" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">Learner</text><text x="100" y="78" text-anchor="middle" font-size="15" fill="#dbeafe">Browser + signed cookie</text></g><path d="M264 197H360" stroke="#60a5fa" stroke-width="5" marker-end="url(#a)"/><g transform="translate(360 118)"><rect width="330" height="158" rx="20" fill="#f8fafc"/><text x="165" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Cloudflare Pages + Workers</text><text x="24" y="80" font-size="15" fill="#475569">• Static guide delivery</text><text x="24" y="108" font-size="15" fill="#475569">• Middleware access checks</text><text x="24" y="136" font-size="15" fill="#475569">• Webhooks and recovery APIs</text></g><path d="M525 276V350" stroke="#60a5fa" stroke-width="5" marker-end="url(#a)"/><g transform="translate(382 350)"><rect width="286" height="126" rx="20" fill="#0f766e"/><text x="143" y="45" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">Cloudflare D1</text><text x="143" y="77" text-anchor="middle" font-size="15" fill="#ccfbf1">passes · purchases · recovery</text><text x="143" y="102" text-anchor="middle" font-size="15" fill="#ccfbf1">claims · analytics · operations</text></g><g transform="translate(760 98)"><rect width="376" height="400" rx="24" fill="#111827"/><text x="188" y="48" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">Connected providers</text><g transform="translate(28 78)"><rect width="320" height="62" rx="13" fill="#1e293b"/><text x="18" y="28" font-size="17" font-weight="700" fill="#f8fafc">PayMongo test</text><text x="18" y="49" font-size="13" fill="#94a3b8">checkout + signed paid webhook</text></g><g transform="translate(28 154)"><rect width="320" height="62" rx="13" fill="#1e293b"/><text x="18" y="28" font-size="17" font-weight="700" fill="#f8fafc">Google rewarded test ad</text><text x="18" y="49" font-size="13" fill="#94a3b8">voluntary reward event</text></g><g transform="translate(28 230)"><rect width="320" height="62" rx="13" fill="#1e293b"/><text x="18" y="28" font-size="17" font-weight="700" fill="#f8fafc">Resend</text><text x="18" y="49" font-size="13" fill="#94a3b8">single-use recovery email</text></g><g transform="translate(28 306)"><rect width="320" height="62" rx="13" fill="#1e293b"/><text x="18" y="28" font-size="17" font-weight="700" fill="#f8fafc">Turnstile</text><text x="18" y="49" font-size="13" fill="#94a3b8">server-side claim verification</text></g></g><path d="M690 197H760" stroke="#60a5fa" stroke-width="5" marker-end="url(#a)"/><g transform="translate(64 548)"><rect width="1072" height="108" rx="20" fill="#172033"/><text x="30" y="38" font-size="20" font-weight="700" fill="#fff">Private operations layer</text><text x="30" y="70" font-size="15" fill="#cbd5e1">Cloudflare Access + ADMIN_API_KEY → Voucher Studio · Analytics · Support queue · Launch Center · Backups · Emergency pause</text></g></g><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#60a5fa"/></marker></defs></svg>